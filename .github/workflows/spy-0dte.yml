name: SPY 0DTE agent

# One long-running job per trading day: waits for the 10:30am ET entry,
# buys, watches the stop, and closes at 3:45pm ET, then commits the log.
#
# Triggered ONLY by workflow_dispatch from an external cron-job.org job at
# 7:20am America/Los_Angeles, Mon-Fri (= 10:20am ET year-round, since ET is
# always PT+3). GitHub's own `schedule:` trigger is deliberately absent —
# both sibling projects measured it firing hours late, and a late start
# here would miss the entry. Do NOT dispatch earlier than ~10:10am ET:
# 10:20 -> ~15:50 ET is ~330 min, and the hosted-runner hard cap is 360;
# main.ts refuses to start before 10:10 ET on Actions for that reason.
on:
  workflow_dispatch: {}

concurrency:
  group: spy-0dte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run trading session
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_BASE_URL: ${{ secrets.WEBULL_BASE_URL }}
          WEBULL_SANDBOX_ACCOUNT_ID: ${{ secrets.WEBULL_SANDBOX_ACCOUNT_ID }}
          SPY_CONTRACTS: "1"
          SPY_STRIKE_OFFSET: "1"
          SPY_STOP_LOSS_PCT: "0.50"
        run: npx tsx main.ts

      - name: Commit state + trade log
        # 2026-10-21: a single pull-rebase-push attempt isn't enough -- this
        # workflow and spy-0dte-live.yml both finish near EOD and can race
        # each other's push, even though they touch disjoint files
        # (spy-*.json{,l} vs live-*.json{,l}; the failure is a ref-update
        # race, "cannot lock ref ... is at X but expected Y", not a content
        # conflict). CONFIRMED LIVE that day: the run's own trade data
        # (a real, correct exit_filled) was silently lost -- the step
        # failed with no retry, and had to be reconstructed by hand from
        # the Actions log afterward. Retrying is enough to fix it, since a
        # fresh rebase against disjoint files has nothing to actually
        # conflict on.
        if: always()
        run: |
          git config user.name "webull-spy-0dte-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f spy-state.json spy-trades.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "spy 0dte session $(date -u +%Y-%m-%d)"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "push attempt $attempt failed (likely a race with the live workflow's own commit), retrying in $((attempt * 5))s..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::failed to push spy-state.json/spy-trades.jsonl after 5 attempts -- today's record may need manual reconciliation from this run's own log"
              exit 1
            fi
          fi
